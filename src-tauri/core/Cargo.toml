[package]
name = "aozora-core"
version = "0.3.4"
edition = "2021"
description = "Aozora Toolbox 核心逻辑：设置模型与 FFmpeg / FFprobe 检测（不依赖 Tauri）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

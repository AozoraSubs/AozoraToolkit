name: Weekly Snapshot Release

on:
  # 每周一 UTC 时间 00:00 自动执行
  schedule:
    - cron: "0 0 * * 1"
  # 手动触发
  workflow_dispatch:
    inputs:
      base_tag:
        description: "基础标签（可选，默认为最近的正式 release）"
        required: false
        type: string

jobs:
  # 第一步：计算快照版本号（只读，不产生任何提交）
  snapshot-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gen.outputs.version }}
      base_tag: ${{ steps.gen.outputs.base_tag }}
      skip_release: ${{ steps.gen.outputs.skip_release }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成快照版本号
        id: gen
        run: |
          # 生成下一个周快照版本号
          VERSION=$(node tools/weekly-snapshot.js)

          # 获取基础标签
          BASE_TAG=$(node tools/weekly-snapshot.js --get-base-tag)

          # 如果手动指定了基础标签，使用手动指定的
          if [ -n "${{ github.event.inputs.base_tag }}" ]; then
            BASE_TAG="${{ github.event.inputs.base_tag }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT

          echo "周快照版本: $VERSION"
          echo "基础标签: ${BASE_TAG:-无}"

          # 检查是否有提交
          if [ -n "$BASE_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count $BASE_TAG..HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
          fi

          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "新提交数量: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "没有新的提交，取消发布"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

  # 第二步：三平台构建；快照版本号临时注入二进制并标记产物文件名，不产生提交
  build:
    needs: snapshot-version
    if: needs.snapshot-version.outputs.skip_release == 'false'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      build_bundles: true
      snapshot_version: ${{ needs.snapshot-version.outputs.version }}

  # 第三步：构建全部通过后创建快照 Pre-release 并附带产物
  weekly-snapshot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成变更日志
        id: changelog
        run: |
          VERSION=${{ needs.snapshot-version.outputs.version }}
          BASE_TAG=${{ needs.snapshot-version.outputs.base_tag }}

          # 构建参数
          ARGS="--tag $VERSION --with-hash"
          if [ -n "$BASE_TAG" ]; then
            ARGS="$ARGS --base $BASE_TAG"
          fi

          # 生成 changelog
          CHANGELOG_CONTENT=$(node tools/generate-changelog.js $ARGS --output-only)

          # 保存到输出
          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "$CHANGELOG_CONTENT"

      - name: 下载构建产物（Windows）
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows-msi

      - name: 下载构建产物（macOS）
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: 下载构建产物（Linux）
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-appimage
          path: artifacts/linux-deb-appimage

      - name: 创建快照发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.snapshot-version.outputs.version }}
          name: Snapshot ${{ needs.snapshot-version.outputs.version }}
          body: |
            # 每周快照发布

            这是一个每周自动生成的快照版本，用于测试和预览最新功能。

            ⚠️ **注意**: 这是一个预发布版本，可能包含不稳定的功能。

            ${{ steps.changelog.outputs.changelog_content }}
          draft: false
          prerelease: true
          files: |
            artifacts/windows-msi/**
            artifacts/macos-dmg/**
            artifacts/linux-deb-appimage/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

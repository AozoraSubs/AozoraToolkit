name: build

# 纯构建工作流：仅由发布 / 周快照工作流通过 workflow_call 复用。
# 打包前先在目标提交上运行同一套三平台检查（直接复用 checks.yml），检查通过才打包。
# 这里不查"最近一次 checks 运行记录"：发布流程推送版本提交用的是 GITHUB_TOKEN，
# 这类推送不会创建新的工作流运行，去查记录只会等到超时。
on:
  workflow_call:
    inputs:
      ref:
        description: "要构建的 Git 引用；留空使用触发提交"
        required: false
        type: string
        default: ""
      build_bundles:
        description: "是否执行完整打包并上传产物（发布流程设为 true）"
        required: false
        type: boolean
        default: false
      snapshot_version:
        description: "周快照版本号（如 26w41a）；非空时注入二进制并标记产物文件名"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # 打包前检查：复用 checks.yml，对与构建完全相同的提交运行三平台检查
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            bundles: msi
            artifact: windows-msi
          - platform: macos-14
            bundles: dmg
            artifact: macos-dmg
          - platform: ubuntu-24.04
            bundles: deb appimage
            artifact: linux-deb-appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并打包
        if: inputs.build_bundles == true
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          # 周快照：把快照版本号编译进二进制（关于页展示），不修改任何版本文件
          AOZORA_SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}

      - name: 在产物文件名中标记快照版本
        if: inputs.build_bundles == true && inputs.snapshot_version != ''
        shell: bash
        run: |
          SNAP="${{ inputs.snapshot_version }}"
          ROOT="src-tauri/target/release/bundle"
          find "$ROOT" -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
            | while IFS= read -r -d '' f; do
                base=$(basename "$f")
                new=$(echo "$base" | sed -E "s/_([0-9]+\.[0-9]+\.[0-9]+)/_\1.${SNAP}/")
                if [ "$new" != "$base" ]; then
                  mv "$f" "$(dirname "$f")/$new"
                  echo "renamed: $base -> $new"
                fi
              done

      - name: 验证 macOS 产物签名
        if: inputs.build_bundles == true && runner.os == 'macOS'
        shell: bash
        run: |
          # `tauri build --bundles dmg` 结束后 .app 已被清理，改为挂载 dmg 验证其中的 .app
          DMG=$(find "src-tauri/target/release/bundle/dmg" -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "未找到 dmg 产物"
            exit 1
          fi
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -quiet -nobrowse
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Aozora Toolbox.app"
          hdiutil detach "$MOUNT" -quiet

      - name: 上传产物
        if: inputs.build_bundles == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 只上传最终安装包，排除 AppImage/deb/dmg 打包过程中的中间文件
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

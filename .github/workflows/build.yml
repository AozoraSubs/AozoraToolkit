name: build

# 每次推送 / PR：只运行三平台检查（前端检查 + cargo fmt/clippy/test），
# 不执行打包以节省 Actions 时间；完整打包（MSI/dmg/deb/AppImage）由发布 /
# 周快照工作流通过 workflow_call 传入 build_bundles: true 时执行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # 供发布 / 周快照工作流复用（每次提交的检查验证仍然保留）
  workflow_call:
    inputs:
      ref:
        description: "要构建的 Git 引用；留空使用触发提交"
        required: false
        type: string
        default: ""
      build_bundles:
        description: "是否执行完整打包并上传产物（发布流程设为 true）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            bundles: msi
            artifact: windows-msi
          - platform: macos-14
            bundles: dmg
            artifact: macos-dmg
          - platform: ubuntu-24.04
            bundles: deb appimage
            artifact: linux-deb-appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Linux system dependencies (WebKitGTK etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm run check
          pnpm run lint
          pnpm run format:check
          pnpm test

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Build and bundle
        if: inputs.build_bundles == true
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Verify macOS bundle signature
        if: inputs.build_bundles == true && runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "src-tauri/target/release/bundle/macos/Aozora Encode.app"

      - name: Upload bundles
        if: inputs.build_bundles == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

name: build

# 纯构建工作流：仅由发布 / 周快照工作流通过 workflow_call 复用。
# 构建前先校验目标提交最近一次 checks 工作流运行已通过；
# 未通过或未运行则直接报错，不重复执行检查。
on:
  workflow_call:
    inputs:
      ref:
        description: "要构建的 Git 引用；留空使用触发提交"
        required: false
        type: string
        default: ""
      build_bundles:
        description: "是否执行完整打包并上传产物（发布流程设为 true）"
        required: false
        type: boolean
        default: false
      snapshot_version:
        description: "周快照版本号（如 26w41a）；非空时注入二进制并标记产物文件名"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            bundles: msi
            artifact: windows-msi
          - platform: macos-14
            bundles: dmg
            artifact: macos-dmg
          - platform: ubuntu-24.04
            bundles: deb appimage
            artifact: linux-deb-appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: 确认提交已通过检查
        if: inputs.build_bundles == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ inputs.ref || github.sha }}"
          echo "校验提交 $SHA 最近一次 checks 工作流运行结果..."

          # 轮询等待（最多 15 分钟）：发布流程刚推送的版本提交，其检查可能仍在进行
          for i in $(seq 1 30); do
            RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&per_page=30" \
              --jq '([.workflow_runs[] | select(.name == "checks")][0] // {}).conclusion // empty')

            if [ "$RESULT" = "success" ]; then
              echo "检查已通过，开始构建"
              exit 0
            fi

            case "$RESULT" in
              in_progress|queued|pending|waiting|requested|"")
                echo "检查尚未完成（${RESULT:-未找到运行记录}），30 秒后重试（$i/30）"
                sleep 30
                ;;
              *)
                echo "提交 $SHA 的检查结果为 $RESULT，拒绝构建"
                exit 1
                ;;
            esac
          done

          echo "等待检查结果超时（15 分钟），拒绝构建"
          exit 1

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并打包
        if: inputs.build_bundles == true
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          # 周快照：把快照版本号编译进二进制（关于页展示），不修改任何版本文件
          AOZORA_SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}

      - name: 在产物文件名中标记快照版本
        if: inputs.build_bundles == true && inputs.snapshot_version != ''
        shell: bash
        run: |
          SNAP="${{ inputs.snapshot_version }}"
          ROOT="src-tauri/target/release/bundle"
          find "$ROOT" -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
            | while IFS= read -r -d '' f; do
                base=$(basename "$f")
                new=$(echo "$base" | sed -E "s/_([0-9]+\.[0-9]+\.[0-9]+)/_\1.${SNAP}/")
                if [ "$new" != "$base" ]; then
                  mv "$f" "$(dirname "$f")/$new"
                  echo "renamed: $base -> $new"
                fi
              done

      - name: 验证 macOS 产物签名
        if: inputs.build_bundles == true && runner.os == 'macOS'
        shell: bash
        run: |
          # `tauri build --bundles dmg` 结束后 .app 已被清理，改为挂载 dmg 验证其中的 .app
          DMG=$(find "src-tauri/target/release/bundle/dmg" -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "未找到 dmg 产物"
            exit 1
          fi
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -quiet -nobrowse
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Aozora Encode.app"
          hdiutil detach "$MOUNT" -quiet

      - name: 上传产物
        if: inputs.build_bundles == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

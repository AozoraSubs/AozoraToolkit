name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: v1.0.0)"
        required: true
        type: string
      base_tag:
        description: "基础标签 (可选，默认为上一个正式 Release；周快照不算)"
        required: false
        type: string

jobs:
  # 第一步：先同步更新版本号并提交（保证构建产物携带本次发布版本号）
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_sha: ${{ steps.commit.outputs.new_sha }}
      skip_release: ${{ steps.check.outputs.skip_release }}
      base_tag: ${{ steps.check.outputs.base_tag }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 解析基础标签并检查提交
        id: check
        env:
          # 手动指定的基础标签通过 env 传入，避免把 workflow_dispatch 输入拼进脚本
          BASE_TAG_INPUT: ${{ github.event.inputs.base_tag }}
        run: |
          # Changelog 的基准固定为「上一个正式 Release」：releases/latest 只返回
          # 非 prerelease / 非 draft 的发布，因此周快照（prerelease）永远不会被选为基准。
          if [ -n "$BASE_TAG_INPUT" ]; then
            BASE_TAG="$BASE_TAG_INPUT"
            echo "使用手动指定的基础标签: $BASE_TAG"
          else
            HTTP_CODE=$(curl -s -o /tmp/latest-release.json -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")

            if [ "$HTTP_CODE" = "404" ]; then
              BASE_TAG=""
              echo "仓库还没有正式 Release：Changelog 覆盖全部历史（--all）"
            elif [ "$HTTP_CODE" = "200" ]; then
              BASE_TAG=$(jq -r '.tag_name // empty' /tmp/latest-release.json)
              if [ -z "$BASE_TAG" ]; then
                echo "releases/latest 响应里没有 tag_name，拒绝继续"
                exit 1
              fi
              echo "上一个正式 Release: $BASE_TAG"
            else
              echo "查询 releases/latest 失败（HTTP $HTTP_CODE），拒绝继续："
              cat /tmp/latest-release.json
              exit 1
            fi
          fi

          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT

          # 检查是否有提交
          if [ -n "$BASE_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count $BASE_TAG..HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
          fi

          echo "新提交数量: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "没有新的提交，取消发布"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成变更日志（写入 CHANGELOG.md 并随版本提交）
        id: changelog
        if: steps.check.outputs.skip_release == 'false'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          BASE_TAG: ${{ steps.check.outputs.base_tag }}
        run: |
          if [ -n "$BASE_TAG" ]; then
            node tools/generate-changelog.js --tag "$RELEASE_VERSION" --with-hash --base "$BASE_TAG" --output-only
          else
            node tools/generate-changelog.js --tag "$RELEASE_VERSION" --with-hash --all --output-only
          fi

      - name: 更新版本号
        if: steps.check.outputs.skip_release == 'false'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node tools/update-version.mjs "$RELEASE_VERSION"

      - name: 提交版本更新
        id: commit
        if: steps.check.outputs.skip_release == 'false'
        env:
          # 通过 env 传入，避免把 workflow_dispatch 输入直接拼进脚本
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          # 版本号统一去掉 v 前缀（AGENTS.md §3.2 的三段式语义化版本）
          VERSION="${RELEASE_VERSION#v}"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/core/Cargo.toml CHANGELOG.md
          git commit -m "build: 版本号升级至 ${VERSION}" || echo "No changes to commit"
          git push
          echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # 第二步：对版本更新后的提交做三平台构建（build.yml 在打包前自行运行 checks）
  build:
    needs: bump-version
    if: needs.bump-version.outputs.skip_release == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump-version.outputs.new_sha }}
      build_bundles: true

  # 第三步：构建全部通过后创建 tag 与 Release，并附带构建产物
  create-release:
    needs: [build, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库（版本更新后的提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_sha }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成变更日志
        id: changelog
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          # 与 bump-version 使用同一个基准，避免两处各自查询产生分歧
          BASE_TAG: ${{ needs.bump-version.outputs.base_tag }}
        run: |
          if [ -n "$BASE_TAG" ]; then
            CHANGELOG_CONTENT=$(node tools/generate-changelog.js --tag "$RELEASE_VERSION" --with-hash --base "$BASE_TAG" --output-only)
          else
            CHANGELOG_CONTENT=$(node tools/generate-changelog.js --tag "$RELEASE_VERSION" --with-hash --all --output-only)
          fi

          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "$CHANGELOG_CONTENT"

      - name: 下载构建产物（Windows）
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows-msi

      - name: 下载构建产物（macOS）
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: 下载构建产物（Linux）
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-appimage
          path: artifacts/linux-deb-appimage

      - name: 创建正式发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          # tag 精确指向本次构建的提交；不依赖默认分支当时的 HEAD
          target_commitish: ${{ needs.bump-version.outputs.new_sha }}
          body: ${{ steps.changelog.outputs.changelog_content }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows-msi/**/*.msi
            artifacts/macos-dmg/**/*.dmg
            artifacts/linux-deb-appimage/**/*.deb
            artifacts/linux-deb-appimage/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: v1.0.0)"
        required: true
        type: string
      base_tag:
        description: "基础标签 (可选，默认为上一个标签)"
        required: false
        type: string

jobs:
  # 第一步：先同步更新版本号并提交（保证构建产物携带本次发布版本号）
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_sha: ${{ steps.commit.outputs.new_sha }}
      skip_release: ${{ steps.check.outputs.skip_release }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 获取基础标签并检查提交
        id: check
        run: |
          # 如果手动指定了基础标签，使用手动指定的
          if [ -n "${{ github.event.inputs.base_tag }}" ]; then
            BASE_TAG="${{ github.event.inputs.base_tag }}"
          else
            # 获取最新的正式 release（通过 GitHub API），如果失败则使用最新标签
            BASE_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null)

            # 如果还是没有标签，设置为空字符串
            if [ "$BASE_TAG" = "null" ]; then
              BASE_TAG=""
            fi
          fi

          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT
          echo "使用基础标签: ${BASE_TAG:-无}"

          # 检查是否有提交
          if [ -n "$BASE_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count $BASE_TAG..HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
          fi

          echo "新提交数量: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "没有新的提交，取消发布"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成变更日志（写入 CHANGELOG.md 并随版本提交）
        id: changelog
        if: steps.check.outputs.skip_release == 'false'
        run: |
          ARGS="--tag ${{ github.event.inputs.version }} --with-hash"
          if [ -n "${{ steps.check.outputs.base_tag }}" ]; then
            ARGS="$ARGS --base ${{ steps.check.outputs.base_tag }}"
          fi
          node tools/generate-changelog.js $ARGS --output-only

      - name: 更新版本号
        if: steps.check.outputs.skip_release == 'false'
        run: node tools/update-version.mjs "${{ github.event.inputs.version }}"

      - name: 提交版本更新
        id: commit
        if: steps.check.outputs.skip_release == 'false'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/core/Cargo.toml CHANGELOG.md
          git commit -m "chore: update version to ${{ github.event.inputs.version }}" || echo "No changes to commit"
          git push
          echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # 第二步：对版本更新后的提交做三平台构建与检查
  build:
    needs: bump-version
    if: needs.bump-version.outputs.skip_release == 'false'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump-version.outputs.new_sha }}
      build_bundles: true

  # 第三步：构建全部通过后创建 tag 与 Release，并附带构建产物
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库（版本更新后的提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_sha }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 解析基础标签
        id: base-tag
        run: |
          if [ -n "${{ github.event.inputs.base_tag }}" ]; then
            BASE_TAG="${{ github.event.inputs.base_tag }}"
          else
            BASE_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null)
            if [ "$BASE_TAG" = "null" ]; then
              BASE_TAG=""
            fi
          fi
          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT

      - name: 生成变更日志
        id: changelog
        run: |
          ARGS="--tag ${{ github.event.inputs.version }} --with-hash"
          if [ -n "${{ steps.base-tag.outputs.base_tag }}" ]; then
            ARGS="$ARGS --base ${{ steps.base-tag.outputs.base_tag }}"
          fi

          CHANGELOG_CONTENT=$(node tools/generate-changelog.js $ARGS --output-only)

          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "$CHANGELOG_CONTENT"

      - name: 下载构建产物（Windows）
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows-msi

      - name: 下载构建产物（macOS）
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: 下载构建产物（Linux）
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-appimage
          path: artifacts/linux-deb-appimage

      - name: 创建正式发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog_content }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows-msi/**
            artifacts/macos-dmg/**
            artifacts/linux-deb-appimage/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
